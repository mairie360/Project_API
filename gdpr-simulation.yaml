# GDPR usage simulation (MAIR-497), played by mairie360/CICD tests/gdpr/simulation on the test
# stack only (docker-compose-gdpr-simulation.yml, gdpr_simulation_test.sh).
#
# Fictitious personas with unique values go through the marker journey of MAIR-290: their names,
# e-mails and phone numbers are written in project and task names, descriptions and comments, in
# query strings and in deliberate errors, then the task and the project are deleted. The logs of
# every container, the Redis keys, the database after the purge and a sample of its free-text
# columns are then checked and reviewed (CICD analyze.mjs).
version: 1
journey: gdpr-marker.yaml
personas: 4
erased: 1
# Project_API holds no account: a persona only lives in the free text of the projects, tasks and
# comments it was written in. The journey already deletes the task and the project, the only
# deletion Project_API offers; the erase step checks that the project is gone. Until the erasure of
# MAIR-289 reaches this content, the erasure findings of the analysis are expected failures.
erase:
  - name: the persona's project is gone after its deletion
    request:
      method: GET
      path: "/api/v1/projects/{{project_id}}/"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
    expect: [404]
