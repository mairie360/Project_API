[package]
name = "project_api" #change api name
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3"
mairie360_api_lib = "1.2.2"
percent-encoding = "2.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
utoipa = { version = "6", features = ["actix_extras", "yaml"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web"] }
tokio = { version = "1.46.0", features = ["full"] }

[dev-dependencies]
once_cell = "1.21.3"
serial_test = "4.0.0"
url = "2.5"


[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
