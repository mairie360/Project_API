[package]
name = "project_api" #change api name
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
async-trait = "0.1.89"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3"
mairie360_api_lib = "3.0.0"
percent-encoding = "2.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
utoipa = { version = "6", features = ["actix_extras", "yaml"] }
utoipa-swagger-ui = { version = "10", features = ["actix-web"] }
tokio = { version = "1.46.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
mairie360_api_lib = { version = "3.0.0", features = ["test-utils"] }
once_cell = "1.21.3"
serial_test = "4.0.0"
actix-http = "3"
# Forges the tokens the refusal sweep sends (same version and features as mairie360_api_lib).
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
url = "2.5"


[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
