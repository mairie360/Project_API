# GDPR log marker journey (MAIR-290), played by mairie360/CICD tests/gdpr/marker.
#
# Project_API receives no account data, but agents write names, e-mails and phone numbers in free
# text (project and task descriptions, comments). The marker's values are put there, in query
# strings and in deliberate errors (refused values, wrong types, unknown rows); the logs of every
# container of docker-compose-gdpr-marker.yml are then searched for them (gdpr_marker_test.sh).
# A log describes an error by its type and context, never by the value it received.
version: 1
target: http://project:3001
wait: /ready
# The admin JWT of the stack (sub=1, the Admin seeded by liquibase), the one the ZAP scan uses.
env: [ADMIN_JWT]
steps:
  - name: create a project naming the marker
    request:
      method: POST
      path: /api/v1/projects/
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {name: "Visit {{marker.first_name}} {{marker.last_name}}", description: "Contact {{marker.email}}, {{marker.phone}}"}
    capture:
      project_id: body.project_id
  - name: create a project without a name (deliberate error)
    request:
      method: POST
      path: /api/v1/projects/
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {name: "", description: "Contact {{marker.email}}, {{marker.phone}}"}
    expect: [400]
  - name: create a project with a group of the wrong type (deliberate error)
    request:
      method: POST
      path: /api/v1/projects/
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {name: "Visit", group_id: "{{marker.email}}"}
    expect: [400]
  - name: list the projects with a refused page size (deliberate error, query string)
    request: {method: GET, path: "/api/v1/projects/?limit={{marker.last_name}}", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
    expect: [400]
  - name: read the project
    request: {method: GET, path: "/api/v1/projects/{{project_id}}/", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
  - name: update the project description
    request:
      method: PATCH
      path: "/api/v1/projects/{{project_id}}/"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {description: "Call {{marker.first_name}} back on {{marker.phone}}"}
    expect: [204]
  - name: update the project with an unknown status (deliberate error)
    request:
      method: PATCH
      path: "/api/v1/projects/{{project_id}}/"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {status: "{{marker.first_name}}"}
    expect: [400]
  - name: update a project that does not exist (deliberate error)
    request:
      method: PATCH
      path: /api/v1/projects/999999/
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {description: "Call {{marker.first_name}} back on {{marker.phone}}"}
    expect: [404]
  - name: create a task naming the marker
    request:
      method: POST
      path: "/api/v1/projects/{{project_id}}/tasks/"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {name: "Call {{marker.first_name}} {{marker.last_name}}", description: "{{marker.email}} / {{marker.phone}}", fields: []}
    capture:
      task_id: body.task_id
  - name: create a task with a due date of the wrong format (deliberate error)
    request:
      method: POST
      path: "/api/v1/projects/{{project_id}}/tasks/"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {name: "Call {{marker.last_name}}", due_date: "{{marker.phone}}", fields: []}
    expect: [400]
  - name: update the task description
    request:
      method: PATCH
      path: "/api/v1/projects/{{project_id}}/tasks/{{task_id}}/"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {description: "Met {{marker.first_name}} {{marker.last_name}} ({{marker.email}})"}
    expect: [204]
  - name: update a task that does not exist (deliberate error)
    request:
      method: PATCH
      path: "/api/v1/projects/{{project_id}}/tasks/999999/"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {description: "Met {{marker.first_name}} {{marker.last_name}} ({{marker.email}})"}
    expect: [404]
  - name: comment the task with the marker's contact
    request:
      method: POST
      path: "/api/v1/projects/{{project_id}}/tasks/{{task_id}}/comments"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {message: "{{marker.first_name}} answered from {{marker.phone}}, {{marker.email}}"}
    expect: [201]
  - name: comment the task with a message of the wrong type (deliberate error)
    request:
      method: POST
      path: "/api/v1/projects/{{project_id}}/tasks/{{task_id}}/comments"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {message: ["{{marker.email}}"]}
    expect: [400]
  - name: read the task collaboration (comments and history)
    request: {method: GET, path: "/api/v1/projects/{{project_id}}/tasks/{{task_id}}/collaboration", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
  - name: list the tasks with a refused offset (deliberate error, query string)
    request: {method: GET, path: "/api/v1/projects/{{project_id}}/tasks/?offset={{marker.email}}", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
    expect: [400]
  - name: add a member of the wrong type (deliberate error)
    request:
      method: POST
      path: "/api/v1/projects/{{project_id}}/users/"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {user_id: "{{marker.last_name}}"}
    expect: [400]
  - name: delete the task
    request: {method: DELETE, path: "/api/v1/projects/{{project_id}}/tasks/{{task_id}}/", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
    expect: [204]
  - name: delete the project
    request: {method: DELETE, path: "/api/v1/projects/{{project_id}}/", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
    expect: [204]
